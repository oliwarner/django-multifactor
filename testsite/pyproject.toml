[project]
name = "django-multifactor-testsite"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<=6.1.999",
    "django-decorator-include",
    "django-extensions",
    "django-debug-toolbar",
    "Werkzeug",
    "pyOpenSSL>=24.2.1",
    "setuptools",
    "packaging",
    "django-multifactor",
]

[tool.uv]
package = false

[tool.uv.sources]
django-multifactor = { path = "..", editable = true }